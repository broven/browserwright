[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-daemon"
version = "0.5.3"
description = "Resolve a browser-level CDP WebSocket from any local Chrome — Mode A CLI + Mode B socket proxy with v0.4 extension-backend (LOCAL_RELAY) + v0.5 cloud-backend (header/mTLS auth) + observability."
requires-python = ">=3.11"
dependencies = [
    "cdp-use==1.4.5",
    "websockets==15.0.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
browser-daemon = "browser_daemon.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "real_chrome: end-to-end test that launches a real Chrome + extension (skipped unless explicitly selected)",
]
