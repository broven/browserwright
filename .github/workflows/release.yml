name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish-pypi:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/browserwright/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build frontend
        run: python -m pip install --upgrade build

      - name: Set package version from git tag
        run: |
          python - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          match = re.fullmatch(
              r"v?(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)"
              r"(?:[a-zA-Z0-9_.!+-]+)?",
              tag,
          )
          if not match:
              print(
                  f"Tag {tag!r} is not a supported package version tag. "
                  "Use tags like v0.6.3.",
                  file=sys.stderr,
              )
              sys.exit(1)

          version = tag[1:] if tag.startswith("v") else tag
          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(r'(?m)^(version\s*=\s*)["\'][^"\']+["\']\s*$')
          updated, count = pattern.subn(
              lambda m: f'{m.group(1)}"{version}"',
              text,
              count=1,
          )
          if count != 1:
              print("Could not find exactly one project.version in pyproject.toml", file=sys.stderr)
              sys.exit(1)

          path.write_text(updated, encoding="utf-8")
          print(f"Package version set from git tag: {version}")
          PY

      - name: Build source and wheel distributions
        run: python -P -m build

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-extension:
    name: Package Chrome extension
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set extension version from git tag
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          match = re.fullmatch(
              r"v?(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)"
              r"(?:[a-zA-Z0-9_.!+-]+)?",
              tag,
          )
          if not match:
              print(
                  f"Tag {tag!r} is not a supported package version tag. "
                  "Use tags like v0.6.3.",
                  file=sys.stderr,
              )
              sys.exit(1)

          version = tag[1:] if tag.startswith("v") else tag
          path = Path("chrome-extension/manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          manifest["version"] = version
          path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(f"Extension version set from git tag: {version}")
          PY

      - name: Package extension
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          zip -r "dist/browserwright-extension-${version}.zip" chrome-extension

      - name: Upload extension to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/browserwright-extension-*.zip
          fail_on_unmatched_files: true

  publish-npm:
    name: Publish pi extension to npm
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@browserwright/pi
    permissions:
      contents: read
      # npm trusted publishing, same model as the PyPI job above: no stored
      # token, the registry verifies this workflow's OIDC identity instead.
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1, and an older npm fails with a
      # plain authentication error rather than saying what is wrong. Node 24
      # already bundles a new enough npm; this pins it so a change to the
      # runner's bundled version cannot quietly break publishing.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Set pi extension version from git tag
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          match = re.fullmatch(
              r"v?(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)"
              r"(?:[a-zA-Z0-9_.!+-]+)?",
              tag,
          )
          if not match:
              print(
                  f"Tag {tag!r} is not a supported package version tag. "
                  "Use tags like v0.6.3.",
                  file=sys.stderr,
              )
              sys.exit(1)

          version = tag[1:] if tag.startswith("v") else tag
          path = Path("pi-extension/package.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          manifest["version"] = version
          path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(f"pi extension version set from git tag: {version}")
          PY

      - name: Run pi extension tests
        working-directory: pi-extension
        run: node --test 'core/*.test.ts'

      - name: Publish to npm
        working-directory: pi-extension
        # --access public is required for the first publish of a scoped package
        # and harmless afterwards. No --dry-run guard here on purpose: the tests
        # above are the gate, and a half-published release is worse than a loud one.
        run: npm publish --access public

  publish-cws:
    # Chrome Web Store publish via the official Upload API (OAuth2). Runs only
    # on pure X.Y.Z tags: CWS accepts only numeric versions and rejects a
    # re-upload of the version currently published, so a pre-release suffix
    # (vX.Y.Z-rc1) cannot live on the same store item without breaking version
    # parity with the daemon — rc builds are tested unpacked and never touch
    # the store (see RELEASING.md "Store & pre-releases").
    name: Publish Chrome extension to Web Store
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '-') }}
    environment:
      name: cws
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set extension version from git tag
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          match = re.fullmatch(
              r"v?(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)"
              r"(?:[a-zA-Z0-9_.!+-]+)?",
              tag,
          )
          if not match:
              print(
                  f"Tag {tag!r} is not a supported package version tag. "
                  "Use tags like v0.6.3.",
                  file=sys.stderr,
              )
              sys.exit(1)

          version = tag[1:] if tag.startswith("v") else tag
          path = Path("chrome-extension/manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          manifest["version"] = version
          path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(f"Extension version set from git tag: {version}")
          PY

      # CWS rejects the GitHub Release zip (everything nested under
      # chrome-extension/); the manifest must sit at the zip root.
      - name: Repackage with manifest at zip root (CWS shape)
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/cws
          cp -r chrome-extension "dist/cws/unpacked"
          cd dist/cws
          zip -qr "browserwright-cws-${version}.zip" unpacked
          cd ../..

      # OAuth2 token exchange. The refresh token is the first stored secret in
      # this repo's CI (CWS has no OIDC/trusted publishing — see RELEASING.md
      # "CWS secrets setup"). The access token is written to a file, never
      # printed, so it cannot leak into the job log.
      - name: Obtain OAuth access token
        run: |
          curl -sS -X POST https://oauth2.googleapis.com/token \
            -d "client_id=${{ secrets.CWS_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.CWS_CLIENT_SECRET }}" \
            -d "refresh_token=${{ secrets.CWS_REFRESH_TOKEN }}" \
            -d "grant_type=refresh_token" > /tmp/cws_token.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/cws_token.json"))
          if "access_token" not in data:
              print(f"CWS token exchange failed: {data}", file=sys.stderr)
              raise SystemExit(1)
          open("/tmp/cws_token", "w").write(data["access_token"])
          PY

      # Upload + publish. Genuine API errors (auth, rejected version) fail the
      # release loudly — a half-published release is worse than a loud one.
      # The one exception is Google deciding to re-review the update (permission
      # or material code change): that is not an error, the item goes live when
      # review clears, so it is reported as a loud note instead of a red build.
      - name: Upload and publish to Chrome Web Store
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          token = open("/tmp/cws_token").read().strip()
          item_id = "${{ secrets.CWS_ITEM_ID }}"
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          zip_path = f"dist/cws/browserwright-cws-{version}.zip"

          def call(url, method, body=b"", extra=None):
              headers = {
                  "Authorization": f"Bearer {token}",
                  "x-goog-api-version": "2",
              }
              if extra:
                  headers.update(extra)
              req = urllib.request.Request(url, data=body, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req) as resp:
                      return json.load(resp)
              except urllib.error.HTTPError as e:
                  detail = e.read().decode("utf-8", errors="replace")
                  print(f"CWS API {method} {url} failed: HTTP {e.code} {detail}",
                        file=sys.stderr)
                  raise

          print(f"Uploading {zip_path} ({os.path.getsize(zip_path)} bytes) ...")
          upload = call(
              f"https://www.googleapis.com/upload/chromewebstore/v1.1/items/{item_id}",
              "PUT",
              open(zip_path, "rb").read(),
              {"Content-Type": "application/zip"},
          )
          if upload.get("uploadState") != "SUCCESS":
              print(f"CWS upload did not succeed: {upload}", file=sys.stderr)
              raise SystemExit(1)
          print(f"Uploaded as item draft: {upload.get('id')}")

          print("Publishing (default audience) ...")
          publish = call(
              f"https://www.googleapis.com/chromewebstore/v1.1/items/{item_id}/publish",
              "POST",
              b"",
              {"Content-Length": "0"},
          )
          statuses = publish.get("status") or []
          print(f"CWS publish response: {publish}")
          # The publish API reports success as status ['OK'] (the docs' sample
          # shows ['PUBLISHED'] — accept both). A review round, when Google
          # decides one is needed, does not change this response; the item
          # goes live when review clears.
          if any(s in ("OK", "PUBLISHED") for s in statuses):
              print(f"Chrome Web Store updated to {version} (publish accepted).")
          else:
              print(
                  "::warning::Chrome Web Store accepted the upload but the "
                  "update is not PUBLISHED yet — Google is re-reviewing it "
                  "(status " + json.dumps(statuses) + "). It goes live when "
                  "review clears; the store then auto-updates users. No "
                  "release action needed."
              )
          PY
