name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish-pypi:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/browserwright/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build frontend
        run: python -m pip install --upgrade build

      - name: Set package version from git tag
        run: |
          python - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          match = re.fullmatch(
              r"v?(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)"
              r"(?:[a-zA-Z0-9_.!+-]+)?",
              tag,
          )
          if not match:
              print(
                  f"Tag {tag!r} is not a supported package version tag. "
                  "Use tags like v0.6.3.",
                  file=sys.stderr,
              )
              sys.exit(1)

          version = tag[1:] if tag.startswith("v") else tag
          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(r'(?m)^(version\s*=\s*)["\'][^"\']+["\']\s*$')
          updated, count = pattern.subn(
              lambda m: f'{m.group(1)}"{version}"',
              text,
              count=1,
          )
          if count != 1:
              print("Could not find exactly one project.version in pyproject.toml", file=sys.stderr)
              sys.exit(1)

          path.write_text(updated, encoding="utf-8")
          print(f"Package version set from git tag: {version}")
          PY

      - name: Build source and wheel distributions
        run: python -P -m build

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-extension:
    name: Package Chrome extension
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set extension version from git tag
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          match = re.fullmatch(
              r"v?(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)"
              r"(?:[a-zA-Z0-9_.!+-]+)?",
              tag,
          )
          if not match:
              print(
                  f"Tag {tag!r} is not a supported package version tag. "
                  "Use tags like v0.6.3.",
                  file=sys.stderr,
              )
              sys.exit(1)

          version = tag[1:] if tag.startswith("v") else tag
          path = Path("chrome-extension/manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          manifest["version"] = version
          path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(f"Extension version set from git tag: {version}")
          PY

      - name: Package extension
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          zip -r "dist/browserwright-extension-${version}.zip" chrome-extension

      - name: Upload extension to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/browserwright-extension-*.zip
          fail_on_unmatched_files: true

  publish-npm:
    name: Publish pi extension to npm
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@browserwright/pi
    permissions:
      contents: read
      # npm trusted publishing, same model as the PyPI job above: no stored
      # token, the registry verifies this workflow's OIDC identity instead.
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1, and an older npm fails with a
      # plain authentication error rather than saying what is wrong. Node 24
      # already bundles a new enough npm; this pins it so a change to the
      # runner's bundled version cannot quietly break publishing.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Set pi extension version from git tag
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          match = re.fullmatch(
              r"v?(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)"
              r"(?:[a-zA-Z0-9_.!+-]+)?",
              tag,
          )
          if not match:
              print(
                  f"Tag {tag!r} is not a supported package version tag. "
                  "Use tags like v0.6.3.",
                  file=sys.stderr,
              )
              sys.exit(1)

          version = tag[1:] if tag.startswith("v") else tag
          path = Path("pi-extension/package.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          manifest["version"] = version
          path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(f"pi extension version set from git tag: {version}")
          PY

      - name: Run pi extension tests
        working-directory: pi-extension
        run: node --test 'core/*.test.ts'

      - name: Publish to npm
        working-directory: pi-extension
        # --access public is required for the first publish of a scoped package
        # and harmless afterwards. No --dry-run guard here on purpose: the tests
        # above are the gate, and a half-published release is worse than a loud one.
        run: npm publish --access public
