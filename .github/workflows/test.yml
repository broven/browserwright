name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Fast gate (daemon + skill + evals)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up mise (python + uv per mise.toml)
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: mise run install

      - name: Run the fast gate
        run: mise run test

  # Real-Chrome E2E (tests/daemon/e2e) — REMOVED from CI, kept for local use.
  #
  # This job (Chrome for Testing + unpacked extension + live daemon under
  # xvfb, `mise run test:e2e`) was added as NON-BLOCKING signal with the
  # explicit plan of flipping `continue-on-error` off once a green baseline
  # was established. The baseline work item never landed, and the job failed
  # in every single run (PR #33, main, PR #34) — and the suite is red on a
  # developer machine too (22 failed / 7 errors on current main), so it is
  # not a CI-environment issue. Every failure is a timing race across the
  # whole stack (2s page-bind over the extension facade, 10s extension-connect
  # fixture, rdp facade "upstream unavailable"), and the diagnostic smoke
  # probe itself was broken (inverted verdict: rc=124 = Chrome stayed up was
  # printed as FAILED; headful probe leaked an orphaned Chrome that failed the
  # step's `rm -rf` under `set -e`).
  #
  # Stabilizing the suite is a real work item (budget tuning across ~30
  # timing-sensitive tests), not a CI patch, so the job was deleted rather
  # than left permanently red. The suite stays opt-in locally:
  # `mise run test:e2e`. Re-add this job only after the suite is green
  # locally, and fix the smoke probe's verdict logic + orphan-Chrome cleanup
  # (kill the probe Chrome via its --user-data-dir before removing the dir).
