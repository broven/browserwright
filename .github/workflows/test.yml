name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Fast gate (daemon + skill + evals)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up mise (python + uv per mise.toml)
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: mise run install

      - name: Run the fast gate
        run: mise run test
