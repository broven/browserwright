name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/browserwright/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build frontend
        run: python -m pip install --upgrade build

      - name: Set package version from git tag
        run: |
          python - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          match = re.fullmatch(
              r"v?(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)"
              r"(?:[a-zA-Z0-9_.!+-]+)?",
              tag,
          )
          if not match:
              print(
                  f"Tag {tag!r} is not a supported package version tag. "
                  "Use tags like v0.6.3.",
                  file=sys.stderr,
              )
              sys.exit(1)

          version = tag[1:] if tag.startswith("v") else tag
          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(r'(?m)^(version\s*=\s*)["\'][^"\']+["\']\s*$')
          updated, count = pattern.subn(
              lambda m: f'{m.group(1)}"{version}"',
              text,
              count=1,
          )
          if count != 1:
              print("Could not find exactly one project.version in pyproject.toml", file=sys.stderr)
              sys.exit(1)

          path.write_text(updated, encoding="utf-8")
          print(f"Package version set from git tag: {version}")
          PY

      - name: Build source and wheel distributions
        run: python -P -m build

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
