description: "v2 Codex Agent E2E — browserwright"

extensions:
  - "file://hooks.py:run_hook"

maxConcurrency: 1

defaultTest:
  options:
    timeout: 600000

prompts:
  - |-
    You are a coding agent. Your current working directory contains SKILL.md.
    Read SKILL.md first, then use the browserwright CLI exactly as documented.
    Follow its confirmation guidance, but when this eval task includes an
    explicit pre-approved reply, treat that as the user's confirmation.

    Task:
    {{task}}

    {% if user_replies %}
    Pre-approved user reply for this eval:
    {{user_replies}}
    {% endif %}

providers:
  # Claude Agent SDK provider kept in provider.py for reference, but disabled
  # while the real code-agent E2E suite targets Codex Agent.
  # - id: "file://provider.py"
  #   config:
  #     model: "claude-sonnet-4-6"
  #     max_turns: 20
  - id: "openai:codex-sdk"
    config:
      model: "{{ env.CODEX_AGENT_E2E_MODEL | default('gpt-5.3-codex') }}"
      working_dir: "./_workspace/skill"
      skip_git_repo_check: true
      sandbox_mode: "workspace-write"
      approval_policy: "never"
      model_reasoning_effort: "medium"
      enable_streaming: true
      cli_env:
        BS_HOME: "../.browserwright"
        XDG_RUNTIME_DIR: "/tmp/bd-agent-e2e-rt"
        TMPDIR: "/tmp/bd-agent-e2e-rt"
        BD_EXTENSION_PORT: "39989"
        BD_BACKEND: "extension"
        no_proxy: "127.0.0.1,localhost"
        NO_PROXY: "127.0.0.1,localhost"

tests:
  # ── Case A: connect + open + summarize ──────────────────────
  - vars:
      task: "Open https://example.com in a browser and tell me what the page is about."
    assert:
      - type: python
        value: "file://scorers/case_a.py:get_assert"
      - type: llm-rubric
        value: "The output mentions that example.com is an illustrative or example domain used for documentation purposes"

  # ── Case B: save preference to memory.md ────────────────────
  - vars:
      task: "From now on, always use the extension backend for browser automation. Remember this preference."
      user_replies: '["yes, go ahead"]'
    assert:
      - type: python
        value: "file://scorers/case_b.py:get_assert"

  # ── Case C: scrape the top 5 Hacker News headlines (one-shot) ──
  - vars:
      task: "Scrape the top 5 story titles from the Hacker News front page (https://news.ycombinator.com) and list them for me."
    assert:
      - type: python
        value: "file://scorers/case_c.py:get_assert"
      - type: llm-rubric
        value: "The output lists about five distinct story titles that plausibly come from the Hacker News front page (short headline-like phrases, not an error or a refusal)."

  # ── Case D: site memory (explicit write) ───────────────────
  - vars:
      task: "Open https://example.com in a browser and save any quirks or notes about this site to site memory."
    assert:
      - type: python
        value: "file://scorers/case_d.py:get_assert"
