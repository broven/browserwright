# Tool runtimes pinned for this repo. `cd` here auto-activates; `mise install`
# installs them; uv drives all deps.
#
# `.python-version` (3.11) is kept alongside this on purpose, not left over: it
# is what pins uv's interpreter choice for the direct `uv run` entrypoints
# (tests/daemon/e2e/run.sh, `uv run pytest`). pyproject's
# `requires-python = ">=3.11"` is only a floor, so without that file uv is free
# to resolve a newer interpreter than the one pinned here and the local venv
# silently drifts off 3.11. Change the version in both places together.
[tools]
python = "3.11"
uv = "latest"
# Pinned, not "latest", and deliberately not run via `uvx`: `uvx ruff` resolves
# whatever ruff is newest at call time, so a ruff release that widens the default
# rule set silently turns `mise run lint` red with no code change (0.16.x did
# exactly that here — 646 findings overnight). The companion rule-set pin lives
# in pyproject `[tool.ruff.lint]`; bump the two together.
ruff = "0.16.1"
# Node was already a de facto dependency before it was ever pinned: three daemon
# tests shell out to `node` to run fragments of chrome-extension/background.js
# under node:vm, and they run in the default gate and in CI. Pinning it also
# gives pi-extension/ a known runtime — its tests are `node --test` over .ts
# files, which needs Node >= 23.6 for unflagged type stripping. 24 is the LTS
# line that clears that floor.
node = "24"

# ---------------------------------------------------------------------------
# Standard repo-harness verbs. Heavy/operational tasks (dev-link, upgrade-global,
# version-check, restart-daemon) live further down; these three are the contract
# every harnessed repo exposes: clone -> `mise run install` -> `mise run test`.
# ---------------------------------------------------------------------------

[tasks.install]
description = "Install all repo dependencies (clone's first command)"
dir = "{{config_root}}"
run = "uv sync --extra ux"

[tasks.dev]
# No long-running dev server: browserwright is a CLI + background daemon + an
# agent-facing skill, driven on demand. The local dev loop is `mise run install`
# then exercise the CLI/REPL, or `mise run dev-link` to symlink this checkout
# into your global PATH/skill dirs. See ONBOARD.md "Run it". Left without a
# `run` on purpose so nobody hardcodes the wrong entrypoint.
description = "No dev server — use the CLI/REPL after install, or `mise run dev-link`. See ONBOARD.md."

# test — fast local gate (mocked; no real Chrome, no network). The heavy
# real-Chrome e2e suite is a separate, opt-in task below.
[tasks."test:daemon"]
description = "Daemon/CDP/proxy/backend/relay unit tests"
dir = "{{config_root}}"
run = "uv run pytest tests/daemon -q"

[tasks."test:skill"]
description = "Agent-layer tests (CLI, sessions, primitives, memory, install flows)"
dir = "{{config_root}}"
run = "uv run pytest tests/skill -q"

[tasks."test:evals"]
description = "Mocked skill command-choice evals (zero-cost, deterministic)"
dir = "{{config_root}}"
run = "uv run python evals/run.py --mock"

[tasks."test:pi"]
description = "pi-extension chain/predicate unit tests (node --test, no network)"
# cwd must be the package root: the test glob is relative, and `node --test`
# expands it itself rather than letting the shell do it.
dir = "{{config_root}}/pi-extension"
run = "node --test 'core/*.test.ts'"

[tasks.test]
description = "Run the fast local gate (daemon + skill + skill evals + pi-extension)"
depends = ["test:daemon", "test:skill", "test:evals", "test:pi"]

[tasks."test:launchd"]
description = "macOS-only: measure real launchd/launchctl behaviour with throwaway LaunchAgents (issue #57)"
dir = "{{config_root}}"
# Not in the fast gate, and CI is ubuntu-only, so this is a local gate by
# construction. It is still worth having: the findings it pins down (legacy
# load/unload DOES replace a process; launchctl exits 0 on failure; KeepAlive
# does not revive a plain non-zero exit) were only ever discoverable against a
# real launchd, and the unit tests that modelled launchd instead got two of the
# three wrong.
run = "uv run pytest tests/daemon/test_issue57_launchctl_semantics.py -m launchd -q"

[tasks."test:e2e"]
description = "Real-Chrome + unpacked-extension E2E (needs Chrome for Testing; opt-in)"
dir = "{{config_root}}"
run = "tests/daemon/e2e/run.sh -v"

# teardown — reclaim the external resources the test/dev loop can leak, scoped
# to THIS worktree. The worktree-orchestration layer (Orca archive, `wt
# cleanup`, Worktrunk pre-remove) probes for this exact task name and runs it
# before deleting a worktree, so anything not reclaimed here leaks per worktree.
#
# Deliberately narrow — it must never touch:
#   - the machine-global daemon (runs ~/.local/share/uv/tools/browserwright/...,
#     never this worktree's .venv), which is LaunchAgent-managed and shared;
#   - the user's daily Chrome or the global daemon's profiles under
#     ~/.cache/browserwright-daemon/profiles/;
#   - a sibling worktree's daemon, or a *live* e2e run in a sibling worktree.
[tasks.teardown]
description = "Reclaim this worktree's leaked e2e daemons/Chrome + test artifacts. Idempotent."
dir = "{{config_root}}"
run = '''
#!/usr/bin/env bash
# Safe to run on a worktree that never ran a test: every step is a no-op then.
set -uo pipefail
ROOT="{{config_root}}"
self=$$

# 1. Daemons spawned from THIS worktree. The e2e fixtures launch
#    `<worktree>/.venv/bin/python -m browserwright.daemon.cli serve`, so the
#    absolute venv path is an exact, collision-free marker: the global daemon
#    and every sibling worktree resolve to a different interpreter path.
pids=$(ps -eo pid=,command= 2>/dev/null \
  | grep -F "$ROOT/.venv" \
  | grep -E "browserwright[-.]daemon|browserwright\.daemon\.cli" \
  | awk -v me="$self" '$1 != me {print $1}')
if [ -n "${pids:-}" ]; then
  echo "teardown: stopping this worktree's daemon(s): $(echo "$pids" | tr '\n' ' ')"
  echo "$pids" | xargs kill 2>/dev/null
  sleep 1
  echo "$pids" | xargs kill -9 2>/dev/null
fi

# 2. Orphaned Chrome for Testing from an interrupted e2e run. The e2e harness
#    always uses a `bd-e2e-chrome-` profile prefix (the daily browser and the
#    global daemon never do), and we additionally require ppid==1 so a sibling
#    worktree's *running* e2e — whose Chrome still has a live pytest parent —
#    is left alone. Orphans are exactly the leak this is meant to reap.
#
#    Only the extension Chrome for Testing (`bd-e2e-chrome-`, a tmpdir profile)
#    is killed here. The daemon-launched rdp Chrome
#    (`~/.cache/browserwright-daemon/profiles/bs-s<id>`) is deliberately NOT:
#    that tree is shared across worktrees, isolated e2e ledgers routinely mint
#    the same local session id, and after the documented macOS launcher handoff
#    a sibling's *live* Chrome also has ppid 1 — so nothing observable on the
#    process tells its browser apart from our leak. Killing the wrong one
#    corrupts a run nobody is watching; leaving a leak costs disk. Report the
#    candidates and let the daemon's own startup sweep, which is scoped to its
#    runtime dir, reclaim them.
orphans=$(ps -eo pid=,ppid=,command= 2>/dev/null \
  | grep -F -- "--user-data-dir=" \
  | grep -F -- "bd-e2e-chrome-" \
  | awk '$2 == 1 {print $1}')
shared=$(ps -eo pid=,ppid=,command= 2>/dev/null \
  | grep -F -- "--user-data-dir=" \
  | grep -F -- "/profiles/bs-se2e-" \
  | awk '$2 == 1 {print $1}')
if [ -n "${shared:-}" ]; then
  echo "teardown: NOT killing shared-profile rdp Chrome (cannot prove it is"
  echo "  this worktree's): $(echo "$shared" | tr '\n' ' ')"
fi
if [ -n "${orphans:-}" ]; then
  echo "teardown: killing orphaned e2e Chrome: $(echo "$orphans" | tr '\n' ' ')"
  echo "$orphans" | xargs kill 2>/dev/null
  sleep 1
  echo "$orphans" | xargs kill -9 2>/dev/null
fi

# 3. Regenerable, gitignored e2e state inside the worktree.
for d in tests/daemon/e2e/_artifacts tests/daemon/e2e/_bs_home; do
  if [ -d "$ROOT/$d" ]; then
    echo "teardown: removing $d"
    rm -rf "${ROOT:?}/$d"
  fi
done

echo "teardown: done (this worktree only)"
exit 0
'''

[tasks.lint]
description = "Static checks: ruff lint (pinned ruff + pinned rule set)"
dir = "{{config_root}}"
run = "ruff check ."

# `ruff format` is NOT part of `lint`: this codebase has never been
# ruff-format-clean (135 of 177 files would be rewritten), so asserting it in the
# gate just keeps `lint` permanently red and tells you nothing. Adopting the
# formatter is a fine idea, but it's a single deliberate commit that rewrites
# most of the repo and blows up `git blame` — run this task when you decide to do
# it, don't let it leak into an unrelated change.
[tasks.format]
description = "Apply ruff format to the whole repo (opt-in; large diff — see comment)"
dir = "{{config_root}}"
run = "ruff format ."

[tasks.build]
description = "Build the wheel/sdist with uv"
dir = "{{config_root}}"
run = "uv build"

[tasks.dev-link]
description = "Development only: link this checkout into global PATH/skill dirs; a broken checkout can break global agents"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
set -euo pipefail

REPO="{{config_root}}"
LOCAL_BIN="$HOME/.local/bin"
mkdir -p "$LOCAL_BIN"

venv="$REPO/.venv"

# Resolve deps from uv.lock into .venv (editable project + dev group + ux extra).
# uv creates/updates .venv and the lockfile as needed; no manual `python -m venv`.
echo "syncing deps with uv..."
(cd "$REPO" && uv sync --extra ux)

# Ensure ~/.local/bin symlinks for BOTH console scripts the package ships.
for bin_name in browserwright browserwright-daemon; do
  src="$venv/bin/$bin_name"
  dst="$LOCAL_BIN/$bin_name"
  if [[ ! -L "$dst" || "$(readlink "$dst")" != "$src" ]]; then
    echo "linking $dst -> $src"
    ln -sf "$src" "$dst"
  fi
done

# Ensure skill dir symlinks.
skill_src="$REPO/skill"
for skill_dst in "$HOME/.agents/skills/browserwright"; do
  if [[ ! -L "$skill_dst" || "$(readlink "$skill_dst")" != "$skill_src" ]]; then
    echo "linking $skill_dst -> $skill_src"
    mkdir -p "$(dirname "$skill_dst")"
    ln -sfn "$skill_src" "$skill_dst"
  fi
done

echo "Done. Installed: browserwright (+ browserwright-daemon), Claude/Codex/Pi skills"
"""

[tasks.reinstall]
description = "Alias for dev-link; development only and not release-isolated"
depends = ["dev-link"]

[tasks.upgrade-global]
description = "Upgrade global browserwright from PyPI, install the matching GitHub Release Chrome extension artifact and pi npm extension, restart the daemon, and verify"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
set -euo pipefail

# `uv tool install --force` instead of `uv tool upgrade`: `upgrade` honors
# whatever specifier landed in the receipt the last time the tool was
# installed, so a one-time `uv tool install browserwright==X.Y.Z` pins the
# receipt at `==X.Y.Z` and every subsequent upgrade is silently capped at
# that version ("Nothing to upgrade"). `install --force` re-resolves against
# PyPI latest each run with no specifier pin, costs ~500ms, and is idempotent,
# which is what this task actually means ("always sync global to PyPI latest").
# `--refresh` busts uv's index cache: right after a release uv otherwise
# resolves to the cached previous version and silently installs the OLD wheel
# (e.g. re-installing 0.6.13 minutes after 0.6.14 went live). See RELEASING.md.
uv tool install browserwright --force --refresh

# --- Install the release-built Chrome extension artifact. -------------------
# The extension is not distributed through PyPI. release.yml publishes a
# browserwright-extension-<version>.zip asset beside each v<version> GitHub
# Release. Download that artifact for the installed CLI version and unpack it
# into a fixed directory that Chrome can keep loaded across upgrades. Override
# the target with BROWSERWRIGHT_CHROME_EXTENSION_TARGET.
EXT_TARGET="${BROWSERWRIGHT_CHROME_EXTENSION_TARGET:-$HOME/Library/Mobile Documents/com~apple~CloudDocs/etc/chrome-extension/browserwright}"
GITHUB_REPO="${BROWSERWRIGHT_GITHUB_REPO:-broven/browserwright}"
ext_changed=0
ext_version=""

hash_ext_dir() {
  local dir="$1"
  if [[ ! -d "$dir" ]]; then
    echo ""
    return
  fi
  ( cd "$dir" && find . -type f \\
      ! -name ".DS_Store" \\
      ! -name "*.pyc" \\
      ! -path "*/__pycache__/*" \\
      -print0 \\
    | LC_ALL=C sort -z \\
    | xargs -0 shasum -a 256 2>/dev/null \\
  ) | shasum -a 256 | awk '{print $1}'
}

download_extension_asset() {
  local version="$1"
  local dest="$2"
  local asset="browserwright-extension-${version}.zip"
  local tag="v${version}"

  if command -v gh >/dev/null 2>&1; then
    if gh release download "$tag" \
      --repo "$GITHUB_REPO" \
      --pattern "$asset" \
      --dir "$(dirname "$dest")" \
      --clobber; then
      if [[ "$(dirname "$dest")/$asset" != "$dest" ]]; then
        mv -f "$(dirname "$dest")/$asset" "$dest"
      fi
      return
    fi
  fi

  if command -v curl >/dev/null 2>&1; then
    curl -fsSL \
      "https://github.com/${GITHUB_REPO}/releases/download/${tag}/${asset}" \
      -o "$dest"
    return
  fi

  echo "Need either gh or curl to download ${GITHUB_REPO} release asset ${asset}." >&2
  return 1
}

if [[ -z "${BROWSERWRIGHT_CHROME_EXTENSION_TARGET:-}" && "$(uname)" != "Darwin" ]]; then
  echo "Skipping chrome-extension install: set BROWSERWRIGHT_CHROME_EXTENSION_TARGET to enable on non-macOS."
else
  cli_version="$(browserwright version)"
  if [[ -z "$cli_version" ]]; then
    echo "Could not determine installed browserwright version." >&2
    exit 1
  fi

  prev_hash="$(hash_ext_dir "$EXT_TARGET")"
  tmp_dir="$(mktemp -d)"
  trap 'rm -rf "$tmp_dir"' EXIT
  zip_path="$tmp_dir/browserwright-extension-${cli_version}.zip"
  unpack_dir="$tmp_dir/unpacked"

  echo "Downloading Chrome extension artifact for browserwright ${cli_version}..."
  download_extension_asset "$cli_version" "$zip_path"
  mkdir -p "$unpack_dir"
  unzip -q "$zip_path" -d "$unpack_dir"

  if [[ -d "$unpack_dir/chrome-extension" ]]; then
    EXT_SRC="$unpack_dir/chrome-extension"
  elif [[ -f "$unpack_dir/manifest.json" ]]; then
    EXT_SRC="$unpack_dir"
  else
    echo "Downloaded extension artifact did not contain chrome-extension/ or manifest.json." >&2
    exit 1
  fi

  mkdir -p "$(dirname "$EXT_TARGET")"
  rm -rf "$EXT_TARGET"
  mkdir -p "$EXT_TARGET"
  (cd "$EXT_SRC" && tar cf - .) | (cd "$EXT_TARGET" && tar xf -)

  new_hash="$(hash_ext_dir "$EXT_TARGET")"
  ext_version="$(python3 -c "import json,sys; print(json.load(open('$EXT_TARGET/manifest.json')).get('version',''))" 2>/dev/null || echo '?')"

  if [[ "$ext_version" != "$cli_version" ]]; then
    echo "Extension artifact version ${ext_version} does not match installed browserwright ${cli_version}." >&2
    exit 1
  fi

  echo ""
  if [[ -z "$prev_hash" ]]; then
    echo "✔ Installed chrome-extension at: $EXT_TARGET (version $ext_version)"
    echo "  First time only: open chrome://extensions/, enable Developer mode,"
    echo "  click 'Load unpacked', and select the path above."
  elif [[ "$prev_hash" != "$new_hash" ]]; then
    ext_changed=1
    echo "🔁 chrome-extension changed (now $ext_version); will trigger automatic reload."
    echo "   Extension path: $EXT_TARGET"
  else
    echo "✔ chrome-extension up to date (version $ext_version, no reload needed)"
  fi
fi

# `--force`: an upgrade is an explicit human intent and must not be blocked by
# someone's open session — but the restart kills every session's live executor
# state, so the names of whatever we interrupted get printed rather than
# swallowed. Silence about a destructive step is the whole disease of issue #57.
restart_report="$(browserwright-daemon restart --force)"
echo "$restart_report"
python3 - "$restart_report" <<'PY'
import json
import sys

try:
    report = json.loads(sys.argv[1])
except ValueError:
    sys.exit(0)
interrupted = report.get("interrupted") or []
if interrupted:
    print("Interrupted by this restart (live executor state is gone; tabs and "
          "session records survive):")
    for line in interrupted:
        print(f"  - {line}")
PY

if [[ "$ext_changed" == "1" ]]; then
  echo "Requesting Chrome extension reload..."
  if browserwright-daemon extension reload; then
    echo "Waiting for extension to reconnect on version $ext_version..."
    python3 - "$ext_version" <<'PY'
import json
import os
import sys
import time
import urllib.request

expected = sys.argv[1]
port = int(os.environ.get("BD_EXTENSION_PORT") or "19989")
deadline = time.monotonic() + 20.0
last = "relay status unavailable"
while time.monotonic() < deadline:
    try:
        with urllib.request.urlopen(f"http://127.0.0.1:{port}/__status__", timeout=1.0) as resp:
            payload = json.load(resp)
        details = payload.get("extension_details") or []
        versions = sorted({
            str(item.get("browserwright_version") or item.get("version") or "")
            for item in details
            if item.get("browserwright_version") or item.get("version")
        })
        if expected in versions:
            # Name the daemon too. "Extension reconnected on 0.9.0" was printed
            # verbatim by a 0.8.2 daemon in issue #57 — true and useless.
            print(f"Extension reconnected on {expected} "
                  f"(daemon {payload.get('daemon_version') or '?'}).")
            sys.exit(0)
        # A store install never matches the just-released version here: it
        # auto-updates from the Chrome Web Store on Chrome's own schedule.
        # The reload step already skipped it; don't warn about a non-problem.
        if details and all(item.get("install_source") == "store" for item in details):
            seen = sorted({
                str(item.get("browserwright_version") or item.get("version") or "")
                for item in details if item.get("browserwright_version") or item.get("version")
            })
            print(f"Store extension connected (version {seen or '?'}) — it "
                  "auto-updates from the Chrome Web Store; the daemon is "
                  "already on " + str(payload.get("daemon_version") or "?") + ".")
            sys.exit(0)
        last = f"connected extension versions: {versions or 'none'}"
    except Exception as exc:
        last = repr(exc)
    time.sleep(0.5)
print(f"Warning: extension reload was requested but not confirmed ({last}).", file=sys.stderr)
sys.exit(0)
PY
  else
    echo "Warning: extension reload command failed; if Chrome is open, reload the unpacked extension manually." >&2
  fi
fi

# `--strict-daemon`: after an upgrade the live daemon must be running this exact
# version. The default check only compares the package to the extension
# manifest, which on a `uv tool` install (no manifest beside the venv) reduces
# to "is the version string semver" — it reported "versions ok" while a 0.8.2
# daemon was still serving (issue #57).
browserwright version check --strict-daemon
browserwright-daemon version check --strict-daemon

# --- Update the pi extension (@browserwright/pi). ---------------------------
# Third release target from the same git tag (ADR-0008): the pi agent's
# bw_web_fetch/bw_web_search tools ship as the npm package @browserwright/pi,
# installed into pi's own config via `pi install npm:@browserwright/pi`
# (~/.pi/agent/settings.json -> ~/.pi/agent/npm/). This task used to leave it
# behind, silently drifting from the CLI after every release.
#
# Deliberately guarded:
#   - `pi update <source>` FAILS when the source is not in settings, and a
#     machine that never installed the pi package must not fail the upgrade.
#   - The quote-inclusive grep matches exactly the unversioned spec
#     `npm:@browserwright/pi` — the only form pi considers update-eligible.
#     A versioned spec (npm:@browserwright/pi@x.y.z) is "pinned" and skipped
#     by pi, so keep the settings entry unversioned or this silently stops
#     updating again.
#   - Only user-scope installs are touched; project-local `.pi/` installs are
#     pinned to their project, not synced by a machine-global upgrade.
if command -v pi >/dev/null 2>&1; then
  if grep -q '"npm:@browserwright/pi"' "$HOME/.pi/agent/settings.json" 2>/dev/null; then
    echo ""
    echo "Updating pi extension @browserwright/pi (npm)..."
    pi update npm:@browserwright/pi
  else
    echo "Skipping pi extension: npm:@browserwright/pi is not in pi user settings."
  fi
else
  echo "Skipping pi extension: pi CLI not on PATH."
fi

echo ""
echo "Done. Global browserwright is on $(browserwright version), the matching extension artifact and pi extension are installed, and the daemon is restarted."
"""

[tasks.version-check]
description = "Verify package, generated skill, daemon, and extension versions agree"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
set -euo pipefail
uv run browserwright version check
uv run browserwright-daemon version check
uv run browserwright --print-skill >/dev/null
"""

[tasks.restart-daemon]
description = "Restart the installed browserwright LaunchAgent daemon after a local release"
dir = "{{config_root}}"
run = "browserwright-daemon restart"
