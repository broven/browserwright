# Tool runtimes pinned for this repo. `cd` here auto-activates; `mise install`
# installs them. Migrated from .python-version (3.11); uv drives all deps.
[tools]
python = "3.11"
uv = "latest"

# ---------------------------------------------------------------------------
# Standard repo-harness verbs. Heavy/operational tasks (dev-link, upgrade-global,
# version-check, restart-daemon) live further down; these three are the contract
# every harnessed repo exposes: clone -> `mise run install` -> `mise run test`.
# ---------------------------------------------------------------------------

[tasks.install]
description = "Install all repo dependencies (clone's first command)"
dir = "{{config_root}}"
run = "uv sync --extra ux"

[tasks.dev]
# No long-running dev server: browserwright is a CLI + background daemon + an
# agent-facing skill, driven on demand. The local dev loop is `mise run install`
# then exercise the CLI/REPL, or `mise run dev-link` to symlink this checkout
# into your global PATH/skill dirs. See ONBOARD.md "Run it". Left without a
# `run` on purpose so nobody hardcodes the wrong entrypoint.
description = "No dev server — use the CLI/REPL after install, or `mise run dev-link`. See ONBOARD.md."

# test — fast local gate (mocked; no real Chrome, no network). Heavy suites
# (e2e real-Chrome, agent-e2e promptfoo) are separate, opt-in tasks below.
[tasks."test:daemon"]
description = "Daemon/CDP/proxy/backend/relay unit tests"
dir = "{{config_root}}"
run = "uv run pytest tests/daemon -q"

[tasks."test:skill"]
description = "Agent-layer tests (CLI, sessions, primitives, memory, install flows)"
dir = "{{config_root}}"
run = "uv run pytest tests/skill --ignore=tests/skill/agent-e2e -q"

[tasks."test:evals"]
description = "Mocked skill command-choice evals (zero-cost, deterministic)"
dir = "{{config_root}}"
run = "uv run python evals/run.py --mock"

[tasks.test]
description = "Run the fast local gate (daemon + skill + skill evals)"
depends = ["test:daemon", "test:skill", "test:evals"]

[tasks."test:e2e"]
description = "Real-Chrome + unpacked-extension E2E (needs Chrome for Testing; opt-in)"
dir = "{{config_root}}"
run = "tests/daemon/e2e/run.sh -v"

[tasks.lint]
description = "Static checks: ruff lint + format check"
dir = "{{config_root}}"
run = "uvx ruff check . && uvx ruff format --check ."

[tasks.build]
description = "Build the wheel/sdist with uv"
dir = "{{config_root}}"
run = "uv build"

[tasks.dev-link]
description = "Development only: link this checkout into global PATH/skill dirs; a broken checkout can break global agents"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
set -euo pipefail

REPO="{{config_root}}"
LOCAL_BIN="$HOME/.local/bin"
mkdir -p "$LOCAL_BIN"

venv="$REPO/.venv"

# Resolve deps from uv.lock into .venv (editable project + dev group + ux extra).
# uv creates/updates .venv and the lockfile as needed; no manual `python -m venv`.
echo "syncing deps with uv..."
(cd "$REPO" && uv sync --extra ux)

# Ensure ~/.local/bin symlinks for BOTH console scripts the package ships.
for bin_name in browserwright browserwright-daemon; do
  src="$venv/bin/$bin_name"
  dst="$LOCAL_BIN/$bin_name"
  if [[ ! -L "$dst" || "$(readlink "$dst")" != "$src" ]]; then
    echo "linking $dst -> $src"
    ln -sf "$src" "$dst"
  fi
done

# Ensure skill dir symlinks.
skill_src="$REPO/skill"
for skill_dst in "$HOME/.agents/skills/browserwright"; do
  if [[ ! -L "$skill_dst" || "$(readlink "$skill_dst")" != "$skill_src" ]]; then
    echo "linking $skill_dst -> $skill_src"
    mkdir -p "$(dirname "$skill_dst")"
    ln -sfn "$skill_src" "$skill_dst"
  fi
done

echo "Done. Installed: browserwright (+ browserwright-daemon), Claude/Codex/Pi skills"
"""

[tasks.reinstall]
description = "Alias for dev-link; development only and not release-isolated"
depends = ["dev-link"]

[tasks.upgrade-global]
description = "Upgrade global browserwright from PyPI, install the matching GitHub Release Chrome extension artifact, restart the daemon, and verify"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
set -euo pipefail

# `uv tool install --force` instead of `uv tool upgrade`: `upgrade` honors
# whatever specifier landed in the receipt the last time the tool was
# installed, so a one-time `uv tool install browserwright==X.Y.Z` pins the
# receipt at `==X.Y.Z` and every subsequent upgrade is silently capped at
# that version ("Nothing to upgrade"). `install --force` re-resolves against
# PyPI latest each run with no specifier pin, costs ~500ms, and is idempotent,
# which is what this task actually means ("always sync global to PyPI latest").
# `--refresh` busts uv's index cache: right after a release uv otherwise
# resolves to the cached previous version and silently installs the OLD wheel
# (e.g. re-installing 0.6.13 minutes after 0.6.14 went live). See RELEASING.md.
uv tool install browserwright --force --refresh

# --- Install the release-built Chrome extension artifact. -------------------
# The extension is not distributed through PyPI. release.yml publishes a
# browserwright-extension-<version>.zip asset beside each v<version> GitHub
# Release. Download that artifact for the installed CLI version and unpack it
# into a fixed directory that Chrome can keep loaded across upgrades. Override
# the target with BROWSERWRIGHT_CHROME_EXTENSION_TARGET.
EXT_TARGET="${BROWSERWRIGHT_CHROME_EXTENSION_TARGET:-$HOME/Library/Mobile Documents/com~apple~CloudDocs/etc/chrome-extension/browserwright}"
GITHUB_REPO="${BROWSERWRIGHT_GITHUB_REPO:-broven/browserwright}"
ext_changed=0
ext_version=""

hash_ext_dir() {
  local dir="$1"
  if [[ ! -d "$dir" ]]; then
    echo ""
    return
  fi
  ( cd "$dir" && find . -type f \\
      ! -name ".DS_Store" \\
      ! -name "*.pyc" \\
      ! -path "*/__pycache__/*" \\
      -print0 \\
    | LC_ALL=C sort -z \\
    | xargs -0 shasum -a 256 2>/dev/null \\
  ) | shasum -a 256 | awk '{print $1}'
}

download_extension_asset() {
  local version="$1"
  local dest="$2"
  local asset="browserwright-extension-${version}.zip"
  local tag="v${version}"

  if command -v gh >/dev/null 2>&1; then
    if gh release download "$tag" \
      --repo "$GITHUB_REPO" \
      --pattern "$asset" \
      --dir "$(dirname "$dest")" \
      --clobber; then
      if [[ "$(dirname "$dest")/$asset" != "$dest" ]]; then
        mv -f "$(dirname "$dest")/$asset" "$dest"
      fi
      return
    fi
  fi

  if command -v curl >/dev/null 2>&1; then
    curl -fsSL \
      "https://github.com/${GITHUB_REPO}/releases/download/${tag}/${asset}" \
      -o "$dest"
    return
  fi

  echo "Need either gh or curl to download ${GITHUB_REPO} release asset ${asset}." >&2
  return 1
}

if [[ -z "${BROWSERWRIGHT_CHROME_EXTENSION_TARGET:-}" && "$(uname)" != "Darwin" ]]; then
  echo "Skipping chrome-extension install: set BROWSERWRIGHT_CHROME_EXTENSION_TARGET to enable on non-macOS."
else
  cli_version="$(browserwright version)"
  if [[ -z "$cli_version" ]]; then
    echo "Could not determine installed browserwright version." >&2
    exit 1
  fi

  prev_hash="$(hash_ext_dir "$EXT_TARGET")"
  tmp_dir="$(mktemp -d)"
  trap 'rm -rf "$tmp_dir"' EXIT
  zip_path="$tmp_dir/browserwright-extension-${cli_version}.zip"
  unpack_dir="$tmp_dir/unpacked"

  echo "Downloading Chrome extension artifact for browserwright ${cli_version}..."
  download_extension_asset "$cli_version" "$zip_path"
  mkdir -p "$unpack_dir"
  unzip -q "$zip_path" -d "$unpack_dir"

  if [[ -d "$unpack_dir/chrome-extension" ]]; then
    EXT_SRC="$unpack_dir/chrome-extension"
  elif [[ -f "$unpack_dir/manifest.json" ]]; then
    EXT_SRC="$unpack_dir"
  else
    echo "Downloaded extension artifact did not contain chrome-extension/ or manifest.json." >&2
    exit 1
  fi

  mkdir -p "$(dirname "$EXT_TARGET")"
  rm -rf "$EXT_TARGET"
  mkdir -p "$EXT_TARGET"
  (cd "$EXT_SRC" && tar cf - .) | (cd "$EXT_TARGET" && tar xf -)

  new_hash="$(hash_ext_dir "$EXT_TARGET")"
  ext_version="$(python3 -c "import json,sys; print(json.load(open('$EXT_TARGET/manifest.json')).get('version',''))" 2>/dev/null || echo '?')"

  if [[ "$ext_version" != "$cli_version" ]]; then
    echo "Extension artifact version ${ext_version} does not match installed browserwright ${cli_version}." >&2
    exit 1
  fi

  echo ""
  if [[ -z "$prev_hash" ]]; then
    echo "✔ Installed chrome-extension at: $EXT_TARGET (version $ext_version)"
    echo "  First time only: open chrome://extensions/, enable Developer mode,"
    echo "  click 'Load unpacked', and select the path above."
  elif [[ "$prev_hash" != "$new_hash" ]]; then
    ext_changed=1
    echo "🔁 chrome-extension changed (now $ext_version); will trigger automatic reload."
    echo "   Extension path: $EXT_TARGET"
  else
    echo "✔ chrome-extension up to date (version $ext_version, no reload needed)"
  fi
fi

browserwright-daemon restart

if [[ "$ext_changed" == "1" ]]; then
  echo "Requesting Chrome extension reload..."
  if browserwright-daemon extension reload; then
    echo "Waiting for extension to reconnect on version $ext_version..."
    python3 - "$ext_version" <<'PY'
import json
import os
import sys
import time
import urllib.request

expected = sys.argv[1]
port = int(os.environ.get("BD_EXTENSION_PORT") or "19989")
deadline = time.monotonic() + 20.0
last = "relay status unavailable"
while time.monotonic() < deadline:
    try:
        with urllib.request.urlopen(f"http://127.0.0.1:{port}/__status__", timeout=1.0) as resp:
            payload = json.load(resp)
        details = payload.get("extension_details") or []
        versions = sorted({
            str(item.get("browserwright_version") or item.get("version") or "")
            for item in details
            if item.get("browserwright_version") or item.get("version")
        })
        if expected in versions:
            print(f"Extension reconnected on {expected}.")
            sys.exit(0)
        last = f"connected extension versions: {versions or 'none'}"
    except Exception as exc:
        last = repr(exc)
    time.sleep(0.5)
print(f"Warning: extension reload was requested but not confirmed ({last}).", file=sys.stderr)
sys.exit(0)
PY
  else
    echo "Warning: extension reload command failed; if Chrome is open, reload the unpacked extension manually." >&2
  fi
fi

browserwright version check
browserwright-daemon version check

echo ""
echo "Done. Global browserwright is on $(browserwright version), the matching extension artifact is installed, and the daemon is restarted."
"""

[tasks.version-check]
description = "Verify package, generated skill, daemon, and extension versions agree"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
set -euo pipefail
uv run browserwright version check
uv run browserwright-daemon version check
uv run browserwright --print-skill >/dev/null
"""

[tasks.restart-daemon]
description = "Restart the installed browserwright LaunchAgent daemon after a local release"
dir = "{{config_root}}"
run = "browserwright-daemon restart"
