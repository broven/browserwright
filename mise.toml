[tasks.dev-link]
description = "Development only: link this checkout into global PATH/skill dirs; a broken checkout can break global agents"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
set -euo pipefail

REPO="{{config_root}}"
LOCAL_BIN="$HOME/.local/bin"
mkdir -p "$LOCAL_BIN"

venv="$REPO/.venv"

# Resolve deps from uv.lock into .venv (editable project + dev group + ux extra).
# uv creates/updates .venv and the lockfile as needed; no manual `python -m venv`.
echo "syncing deps with uv..."
(cd "$REPO" && uv sync --extra ux)

# Ensure ~/.local/bin symlinks for BOTH console scripts the package ships.
for bin_name in browserwright browserwright-daemon; do
  src="$venv/bin/$bin_name"
  dst="$LOCAL_BIN/$bin_name"
  if [[ ! -L "$dst" || "$(readlink "$dst")" != "$src" ]]; then
    echo "linking $dst -> $src"
    ln -sf "$src" "$dst"
  fi
done

# Ensure skill dir symlinks.
skill_src="$REPO/skill"
for skill_dst in "$HOME/.agents/skills/browserwright"; do
  if [[ ! -L "$skill_dst" || "$(readlink "$skill_dst")" != "$skill_src" ]]; then
    echo "linking $skill_dst -> $skill_src"
    mkdir -p "$(dirname "$skill_dst")"
    ln -sfn "$skill_src" "$skill_dst"
  fi
done

echo "Done. Installed: browserwright (+ browserwright-daemon), Claude/Codex/Pi skills"
"""

[tasks.reinstall]
description = "Alias for dev-link; development only and not release-isolated"
depends = ["dev-link"]

[tasks.upgrade-global]
description = "Upgrade the globally installed browserwright (uv tool) to the latest PyPI version, restart the daemon, sync the Chrome extension to the global load path, and verify"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
set -euo pipefail

REPO="{{config_root}}"

# `uv tool install --force` instead of `uv tool upgrade`: `upgrade` honors
# whatever specifier landed in the receipt the last time the tool was
# installed, so a one-time `uv tool install browserwright==X.Y.Z` pins the
# receipt at `==X.Y.Z` and every subsequent upgrade is silently capped at
# that version ("Nothing to upgrade"). `install --force` re-resolves against
# PyPI latest each run with no specifier pin, costs ~500ms, and is idempotent,
# which is what this task actually means ("always sync global to PyPI latest").
uv tool install browserwright --force
browserwright-daemon restart
browserwright version check
browserwright-daemon version check

# --- Sync chrome-extension/ to the stable global load path. -----------------
# Mirrors what `release_install.sync_chrome_extension` used to do for the
# (now-retired) local release installer: copy the repo's chrome-extension/
# into a fixed directory that Chrome can keep loaded as an unpacked extension
# across browserwright upgrades. Override the target with
# BROWSERWRIGHT_CHROME_EXTENSION_TARGET; default mirrors release_install.py.
EXT_SRC="$REPO/chrome-extension"
EXT_TARGET="${BROWSERWRIGHT_CHROME_EXTENSION_TARGET:-$HOME/Library/Mobile Documents/com~apple~CloudDocs/etc/chrome-extension/browserwright}"

hash_ext_dir() {
  local dir="$1"
  if [[ ! -d "$dir" ]]; then
    echo ""
    return
  fi
  ( cd "$dir" && find . -type f \\
      ! -name ".DS_Store" \\
      ! -name "*.pyc" \\
      ! -path "*/__pycache__/*" \\
      -print0 \\
    | LC_ALL=C sort -z \\
    | xargs -0 shasum -a 256 2>/dev/null \\
  ) | shasum -a 256 | awk '{print $1}'
}

if [[ ! -d "$EXT_SRC" ]]; then
  echo "Skipping chrome-extension sync: $EXT_SRC not found in repo checkout."
elif [[ -z "${BROWSERWRIGHT_CHROME_EXTENSION_TARGET:-}" && "$(uname)" != "Darwin" ]]; then
  echo "Skipping chrome-extension sync: set BROWSERWRIGHT_CHROME_EXTENSION_TARGET to enable on non-macOS."
else
  prev_hash="$(hash_ext_dir "$EXT_TARGET")"
  mkdir -p "$(dirname "$EXT_TARGET")"
  rsync -a --delete \\
    --exclude '__pycache__' \\
    --exclude '*.pyc' \\
    --exclude '.DS_Store' \\
    "$EXT_SRC/" "$EXT_TARGET/"

  # Pin target manifest.json version to the installed CLI version. Today the
  # PyPI release flow uses the git tag as the single source of truth for the
  # package version, but it does NOT commit a matching bump back to
  # chrome-extension/manifest.json in the repo. That means the source manifest
  # we just rsync'd over can lag behind the published browserwright version
  # (e.g., source says 0.6.2 while uv tool just upgraded to 0.6.4). Rewriting
  # the version field here keeps the loaded extension's about-page version in
  # lockstep with the daemon/CLI version users actually have on their machine.
  cli_version="$(browserwright version)"
  if [[ -f "$EXT_TARGET/manifest.json" && -n "$cli_version" ]]; then
    python3 - "$EXT_TARGET/manifest.json" "$cli_version" <<'PY'
import re
import sys
from pathlib import Path

path = Path(sys.argv[1])
version = sys.argv[2]
text = path.read_text(encoding="utf-8")
updated, count = re.subn(
    r'("version"\\s*:\\s*)"[^"]+"',
    lambda m: f'{m.group(1)}"{version}"',
    text,
    count=1,
)
if count != 1:
    sys.exit(f"could not rewrite version field in {path}")
path.write_text(updated, encoding="utf-8")
PY
  fi

  new_hash="$(hash_ext_dir "$EXT_TARGET")"
  ext_version="$(python3 -c "import json,sys; print(json.load(open('$EXT_TARGET/manifest.json')).get('version',''))" 2>/dev/null || echo '?')"

  echo ""
  if [[ -z "$prev_hash" ]]; then
    echo "✔ Installed chrome-extension at: $EXT_TARGET (version $ext_version)"
    echo "  First time only: open chrome://extensions/, enable Developer mode,"
    echo "  click 'Load unpacked', and select the path above."
  elif [[ "$prev_hash" != "$new_hash" ]]; then
    echo "🔁 chrome-extension changed (now $ext_version) — RELOAD REQUIRED"
    echo "   1. Open chrome://extensions/"
    echo "   2. Find 'browserwright-daemon relay' and click the reload (↻) icon"
    echo "   Extension path: $EXT_TARGET"
  else
    echo "✔ chrome-extension up to date (version $ext_version, no reload needed)"
  fi
fi

echo ""
echo "Done. Global browserwright is on $(browserwright version) and the daemon is restarted."
"""

[tasks.version-check]
description = "Verify package, generated skill, daemon, and extension versions agree"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
set -euo pipefail
uv run browserwright version check
uv run browserwright-daemon version check
uv run browserwright --print-skill >/dev/null
"""

[tasks.restart-daemon]
description = "Restart the installed browserwright LaunchAgent daemon after a local release"
dir = "{{config_root}}"
run = "browserwright-daemon restart"
