[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "browserwright"
# Placeholder, never bumped per release — the git tag is the single source of
# truth. `.github/workflows/release.yml` rewrites this line (and
# `chrome-extension/manifest.json`) from `GITHUB_REF_NAME` at build time, so a
# release commit must NOT edit it. The sentinel is `0.0.0` on purpose: it is
# valid semver, is below every published version, and can never be mistaken for
# a real release — which a stale-but-plausible number (this used to sit at
# "0.6.2" while tags had reached v0.8.0) very much could. Keep it in lockstep
# with the manifest, keep the line on its own with no trailing comment: the
# stamping regex is `^(version\s*=\s*)["'][^"']+["']\s*$` and CI aborts unless
# it matches exactly once. `tests/skill/test_release_versioning.py` enforces all
# of that before a tag is ever pushed. See RELEASING.md.
version = "0.0.0"
description = "Browserwright — let AI/code agents drive a real or isolated browser and author userscripts. Single package: the agent-facing REPL/site-skills/memory layer plus the bundled browser-resolving daemon (CDP proxy + extension/cloud backends)."
requires-python = ">=3.11"
dependencies = [
    "websockets==15.0.1",
    "pillow==12.2.0",
    "httpx>=0.27",
    # Phase C: the skill heredoc injects a real Playwright `page`/`context`
    # bound to the daemon facade, so playwright is a runtime dependency now (it
    # was previously dev-only). `playwright install chromium` is still needed
    # for tests that launch a browser; the daemon-facade path drives the
    # daemon-resolved Chrome and does not need Playwright's bundled browser.
    "playwright>=1.60.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
ux = ["rich>=13"]

[dependency-groups]
dev = [
    "coverage>=7",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
browserwright = "browserwright.cli:main"
browserwright-daemon = "browserwright.daemon.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
browserwright = [
    "site_skills_starter/**/*.md",
    "site_skills_starter/**/*.py",
    "skill_runtime.md",
]

[tool.setuptools.exclude-package-data]
browserwright = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "real_chrome: end-to-end test that launches a real Chrome + extension (skipped unless explicitly selected)",
]

# Lint config. `select` is explicit on purpose: ruff's *default* rule set grew
# substantially by 0.16.x (ASYNC/S/BLE/B/UP/RUF/... are now on by default), which
# silently took this repo from clean to 646 findings without a line of code
# changing. Pinning the ruff version (mise `[tools]`) *and* the rule set here is
# what makes `mise run lint` mean the same thing on every machine and across ruff
# upgrades. Widening the set is a deliberate, separate decision — do it in one
# focused pass, not as a side effect of an unrelated ruff release.
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# api.py exists purely to re-export the agent-facing surface; the names it
# imports are listed in `EXPORTS` as *strings*, which ruff can't see as usage.
# Without this, `--fix` strips the whole re-export block and every
# `api.<name>` lookup dies at runtime (verified: it breaks 22 test modules).
"src/browserwright/api.py" = ["F401"]
# Site-skill task snippets are executed with a Playwright `page` injected into
# globals by the executor — `page` is undefined at import time by design.
"src/browserwright/site_skills_starter/**" = ["F821"]
# pytest fixtures are shadowed by same-named test parameters (the standard
# fixture-injection pattern), and the e2e helpers extend sys.path before
# importing, so imports legitimately follow statements.
"tests/daemon/e2e/**" = ["E402", "F811"]
# Agent hook scripts bootstrap sys.path before importing their own modules.
".claude/hooks/**" = ["E402"]
".cursor/hooks/**" = ["E402"]

[tool.coverage.run]
source = ["src/browserwright"]
omit = [
    "src/browserwright/__main__.py",
    "src/browserwright/site_skills_starter/*",
]

[tool.coverage.report]
skip_covered = true
sort = "Cover"
