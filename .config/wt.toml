# .config/wt.toml — browserwright worktree lifecycle
#
# Source of truth. Conductor and Superset wrappers (conductor.json,
# .superset/config.json) are generated from this file via:
#   bash .claude/skills/worktree-config/scripts/generate_wrappers.sh .
#
# All commands run from the worktree root (repo root). No path template
# variables are needed — all paths are relative. No env fallback chains
# needed — no dynamic ports/workspace names.

# Pre-warm the uv env so the first `uv run` in a fresh worktree is instant
# rather than resolving deps on-demand. Single package now (the agent-facing
# layer + the bundled daemon under browserwright.daemon).
[post-create]
sync = "uv sync --extra test"

# Unit tests. agent-e2e is excluded: it requires the claude_agent_sdk (not in
# the default venv) and a live Chrome extension. real_chrome e2e is opt-in and
# can be run separately via: tests/daemon/e2e/run.sh
[pre-merge]
test = "uv run --extra test python -m pytest -q -m 'not real_chrome' --ignore=tests/skill/agent-e2e"

# Kill any stale test daemon on port 29989 left by an interrupted e2e run.
[pre-remove]
cleanup-e2e = "lsof -ti :29989 2>/dev/null | xargs kill 2>/dev/null || true"
