<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>browserwright-daemon relay</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          -apple-system, "Segoe UI", system-ui, sans-serif;
        font-size: 13px;
        line-height: 1.4;
      }
      body {
        width: 280px;
        margin: 0;
        padding: 12px 14px;
      }
      h1 {
        font-size: 13px;
        font-weight: 600;
        margin: 0 0 8px 0;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
        padding: 6px 8px;
        background: rgba(127, 127, 127, 0.1);
        border-radius: 6px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #888;
        flex-shrink: 0;
      }
      .dot.connected { background: #4caf50; }
      .dot.disconnected { background: #ef5350; }
      .label { flex: 1; min-width: 0; }
      .label .primary { font-weight: 500; }
      .label .secondary { font-size: 11px; opacity: 0.7; }
      button {
        width: 100%;
        padding: 8px 10px;
        margin-bottom: 6px;
        border: 1px solid rgba(127, 127, 127, 0.4);
        background: transparent;
        border-radius: 6px;
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      button:hover {
        background: rgba(127, 127, 127, 0.1);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .attached-list {
        max-height: 140px;
        overflow-y: auto;
        margin-bottom: 6px;
        font-size: 11px;
      }
      .attached-list .row {
        padding: 4px 6px;
        border-radius: 4px;
      }
      .attached-list .row:nth-child(odd) {
        background: rgba(127, 127, 127, 0.06);
      }
      .section {
        border-top: 1px solid rgba(127, 127, 127, 0.2);
        margin-top: 10px;
        padding-top: 10px;
      }
      .section .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .switch {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
      }
      #us-list {
        list-style: none;
        margin: 8px 0 0 0;
        padding: 0;
      }
      #us-list li {
        padding: 3px 0;
      }
      .hint {
        font-size: 11px;
        opacity: 0.7;
        margin-top: 8px;
      }
      code {
        font-size: 11px;
        background: rgba(127, 127, 127, 0.15);
        padding: 1px 4px;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <h1>browserwright-daemon relay</h1>
    <div class="status">
      <span class="dot" id="dot"></span>
      <div class="label">
        <div class="primary" id="status-primary">Checking…</div>
        <div class="secondary" id="status-secondary"></div>
      </div>
    </div>

    <button id="attach-btn">Attach this tab</button>
    <button id="detach-btn">Detach this tab</button>

    <div class="attached-list" id="attached-list"></div>

    <div class="section" id="us-section">
      <div class="row">
        <strong>Scripts on this site</strong>
        <label class="switch"><input type="checkbox" id="us-master"> <span>All</span></label>
      </div>
      <ul id="us-list"></ul>
      <p class="hint" id="us-empty" style="display:none">No userscripts match this site.</p>
    </div>

    <div class="hint">
      Daemon expected at <code>ws://127.0.0.1:19989</code>. Start with:
      <code>browserwright-daemon serve --backend extension</code>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
