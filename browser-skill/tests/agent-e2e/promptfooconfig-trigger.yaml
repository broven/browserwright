description: "v2 SDK sub-agent E2E — Case E skill triggering (no daemon)"

maxConcurrency: 1

prompts:
  - "{{task}}"

providers:
  - id: "file://provider_trigger.py"
    config:
      model: "claude-sonnet-4-6"

tests:
  # ── Case E: skill auto-triggering (recall only) ────────────
  - vars:
      task: "帮我看看 example.com 写了啥并截图"
    assert:
      - type: python
        value: "file://scorers/case_e.py:get_assert"

  - vars:
      task: "Scrape the titles from this page: https://news.ycombinator.com"
    assert:
      - type: python
        value: "file://scorers/case_e.py:get_assert"

  - vars:
      task: "打开 https://github.com 看看今天的 trending repos"
    assert:
      - type: python
        value: "file://scorers/case_e.py:get_assert"

  - vars:
      task: "Take a screenshot of https://example.com and tell me what you see"
    assert:
      - type: python
        value: "file://scorers/case_e.py:get_assert"
